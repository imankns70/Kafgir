services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kafgir_test
      POSTGRES_USER: kafgir
      POSTGRES_PASSWORD: kafgir-local-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kafgir -d kafgir_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - kafgir-postgres-data:/var/lib/postgresql/data

volumes:
  kafgir-postgres-data:
