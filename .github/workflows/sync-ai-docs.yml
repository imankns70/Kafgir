name: One-time AI documentation sync

on:
  push:
    branches: [development]
    paths:
      - .github/workflows/sync-ai-docs.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Synchronize AI project knowledge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def insert_after_title(path: str, title: str, marker: str, block: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if marker in text:
                  return
              prefix = title + '\n\n'
              if not text.startswith(prefix):
                  raise SystemExit(f'unexpected heading in {path}')
              file.write_text(prefix + block.rstrip() + '\n\n' + text[len(prefix):], encoding='utf-8')

          insert_after_title(
              '.ai/PROJECT_STATE.md',
              '# Project state',
              '## 2026-08-14 — Active-order tracking, checkout address picker, and food-detail UX',
              '''## 2026-08-14 — Active-order tracking, checkout address picker, and food-detail UX

          - The customer Web app has a mobile-only persistent active-order tracker mounted at the root layout,
            so an in-flight order remains visible while the customer moves between menu, cart, profile, contact,
            and food-detail views.
          - Active tracking supports multiple concurrent orders. The compact pill shows the active-order count and
            the bottom sheet lists each order separately with current status, progress, food summary, delivery time,
            address, and last status update.
          - A customer may confirm `تحویل گرفتم` only for their own order while it is `Ready`. The shared order
            status transition records `Delivered`, `delivered_at`, and order status history; a concurrent Admin
            delivery update is handled safely. Delivery confirmation does not imply payment settlement.
          - Active-order polling is intentionally conservative: about 60 seconds while an active order exists and
            5 minutes while idle, with immediate refresh on focus/visibility, authentication changes, and order changes.
          - Checkout saved-address selection uses a custom readable picker instead of a native one-line select. Each
            choice shows the address title, default marker when applicable, city, and the complete wrapped address.
          - Food-detail UX now treats short/full descriptions as editorial customer copy: the values remain visible,
            but the database-like `توضیح کوتاه` / `توضیح کامل` headings are hidden. Portion contents, allergy
            information, and ingredients retain useful labels, while missing optional customer copy is not advertised.
          - The food-detail visual layer is scoped to the food-detail shell and keeps the existing desktop purchase
            controls plus the mobile sticky purchase bar intact.
          - No database migration was required for these changes. The final lint, unit-test, Web build, and Electron
            build pipeline passed before the application changes were promoted to `main`.

          ## 2026-08-14 — Development-first release flow

          - Routine implementation now lands on `development`; `main` is the production release boundary.
          - GitHub CI validates both `development` and `main`, while Netlify remains connected to `main` for production.
          - Netlify monorepo ignore rules skip builds for changes that do not affect the customer Web application,
            reducing unnecessary production credit usage.'''
          )

          tasks = Path('.ai/TASKS.md')
          task_text = tasks.read_text(encoding='utf-8')
          marker = '## Completed — 2026-08-14 active orders, checkout addresses, and food-detail UX'
          if marker not in task_text:
              prefix = '# Tasks\n\n'
              block = '''## Completed — 2026-08-14 active orders, checkout addresses, and food-detail UX

          - [x] Add a mobile-only global active-order tracker that remains visible across customer views.
          - [x] Support multiple simultaneous active orders with a selectable list and per-order progress/details.
          - [x] Allow the authenticated owner to confirm receipt only from `Ready`, using the shared Delivered
            transition so status history and delivery timestamp remain authoritative.
          - [x] Keep delivery confirmation independent from payment settlement.
          - [x] Replace the saved-address native select with a readable picker that shows title and full address.
          - [x] Redesign food-detail information hierarchy and hide the `توضیح کوتاه` / `توضیح کامل` labels while
            preserving their values and keeping practical portion/allergy/ingredient labels.
          - [x] Validate lint, tests, Web build, and Electron build, then promote the product changes to `main`.

          ## Completed — 2026-08-14 development-first Netlify workflow

          - [x] Use `development` for routine work and reserve `main` for production releases.
          - [x] Run CI on both development and main.
          - [x] Add Netlify monorepo ignore rules so unrelated Admin/docs/AI-only changes do not consume a Web build.'''
              if not task_text.startswith(prefix):
                  raise SystemExit('unexpected heading in .ai/TASKS.md')
              task_text = prefix + block + '\n\n' + task_text[len(prefix):]

          task_text = task_text.replace(
              '- [x] Show labeled short/full description, portion contents, and allergy sections on the Mini App food-detail page.',
              '- [x] Show short/full description values on the Mini App food-detail page without database-style headings; keep portion contents and allergy sections labelled.'
          )
          tasks.write_text(task_text, encoding='utf-8')

          insert_after_title(
              '.ai/DECISIONS.md',
              '# Decisions',
              '## 2026-08-14 — Mobile active orders and customer-owned delivery confirmation',
              '''## 2026-08-14 — Mobile active orders and customer-owned delivery confirmation

          - Treat `PendingConfirmation`, `Confirmed`, `Preparing`, and `Ready` as active customer orders; delivered
            and cancelled orders must disappear from the persistent tracker.
          - Keep the tracker mobile-only and global to the customer Web layout, with a compact always-available pill
            and a bottom sheet for detailed progress rather than a large persistent card.
          - When several active orders exist, show them as a list and let the customer select the order whose details
            they want to inspect; do not collapse multiple independent orders into one synthetic status.
          - Customer receipt confirmation is permitted only for the authenticated owner and only from `Ready`.
            Reuse the shared order-status transition so `Delivered`, `delivered_at`, and history are written through
            one authoritative path. Do not automatically change payment state when physical delivery is confirmed.
          - Keep background polling conservative and refresh immediately on foreground/order/authentication events.

          ## 2026-08-14 — Checkout address and food-detail presentation

          - Saved delivery addresses are multi-line content, so checkout uses a custom address picker that can show
            both the address title/default marker and the complete city/address text. A native one-line select is not
            the preferred customer experience for saved addresses.
          - `shortDescription` and `fullDescription` are customer-facing editorial content, not form labels. Preserve
            their values but do not display the literal `توضیح کوتاه` or `توضیح کامل` headings on the food page.
          - Keep practical scanning labels for portion contents, allergy information, and ingredients; hide optional
            customer-copy blocks entirely when no value exists instead of showing `ثبت نشده`.
          - Scope the richer food-detail styling to `.food-detail-shell` in a dedicated UX stylesheet so it cannot
            leak into checkout, profile, order, or other general panels.

          ## 2026-08-14 — Development-first production releases

          - Make `development` the normal integration branch and move `main` only when a tested release is ready.
          - Keep Netlify production deployment bound to `main`; use monorepo ignore rules to skip Web builds for
            unrelated paths rather than adding a second deployment mechanism.'''
          )
          PY

      - name: Commit synchronized AI docs
        shell: bash
        run: |
          git diff --check
          if git diff --quiet -- .ai/PROJECT_STATE.md .ai/TASKS.md .ai/DECISIONS.md; then
            echo "AI documentation already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ai/PROJECT_STATE.md .ai/TASKS.md .ai/DECISIONS.md
          git commit -m "Sync latest project knowledge"
          git push origin HEAD:development
