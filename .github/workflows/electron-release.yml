name: Electron Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package-windows:
    name: Build and publish Windows installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package Electron for Windows
        run: npm run package --workspace @kafgir/admin

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem apps/admin/dist-installer -File |
            Where-Object { $_.Extension -in '.exe', '.blockmap', '.yml' } |
            ForEach-Object { $_.FullName }

          if ($assets.Count -eq 0) {
            throw 'Electron installer assets were not generated.'
          }

          $notes = @"
          ## تغییرات

          - افزودن صفحه «ارتباط با مشتری» برای گفت‌وگوهای خصوصی و آفلاین
          - افزودن صف بررسی نظرات سفارش با وضعیت‌های جدید، دیده‌شده و رسیدگی‌شده
          - امکان پاسخ خصوصی مدیر به نظر سفارش در همان صندوق گفت‌وگوی مشتری
          - حفظ اصلاحات اخیر سفارش دستی، فاکتور، ظرفیت منوی روز و رابط کاربری Electron
          "@
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

          if (gh release view $env:GITHUB_REF_NAME 2>$null) {
            gh release upload $env:GITHUB_REF_NAME $assets --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $assets `
              --verify-tag `
              --title "Kafgir Admin $env:GITHUB_REF_NAME" `
              --notes-file release-notes.md
          }
