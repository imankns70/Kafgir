name: Electron Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package-windows:
    name: Build and publish Windows installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package Electron for Windows
        run: npm run package --workspace @kafgir/admin

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem apps/admin/dist-installer -File |
            Where-Object { $_.Extension -in '.exe', '.blockmap', '.yml' } |
            ForEach-Object { $_.FullName }

          if ($assets.Count -eq 0) {
            throw 'Electron installer assets were not generated.'
          }

          $notes = @"
          ## تغییرات

          - اصلاح کنتراست و خوانایی تولتیپ‌های آمار کاربران در Electron
          - افزایش اندازه و فاصله خطوط متن فارسی
          - بهبود عرض و جای‌گیری تولتیپ در چیدمان‌های دو و چهارستونه
          - افزودن عنوان دسترس‌پذیر اختصاصی برای هر شاخص
          "@
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

          gh release create $env:GITHUB_REF_NAME $assets `
            --verify-tag `
            --title "Kafgir Admin $env:GITHUB_REF_NAME" `
            --notes-file release-notes.md
