[build]
  # Skip Netlify builds when a commit does not affect the customer web app or its shared runtime dependencies.
  # Netlify continues the build when this command exits 1 and skips it when it exits 0.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF apps/web packages/contracts packages/server-core package.json package-lock.json tsconfig.base.json branding netlify.toml"
